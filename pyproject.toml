[project]
name = "build-your-etf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "StromFLIX", email = "felix.moenckemeyer@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.15",
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.14.0",
    "html5lib>=1.1",
    "lxml>=6.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "xlrd>=2.0.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "requests>=2.32.0",
    "google-generativeai>=0.8.5",
    "ortools>=9.12.4544",
]

[project.scripts]
build-your-etf = "build_your_etf:main"
etf-builder-server = "src.builder.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
